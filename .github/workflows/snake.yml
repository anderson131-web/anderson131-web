name: Generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours, keeps the animation current
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: anderson131-web
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg

      # Publishes the generated SVGs to a separate `output` branch so they
      # never clutter main's commit history — the README embeds them
      # straight from that branch's raw URL.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
